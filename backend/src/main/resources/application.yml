spring:
  application:
    name: cookbook-backend

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  datasource:
    postgres:
      url: ${POSTGRES_URL:}
      username: ${POSTGRES_USER:postgres}
      password: ${POSTGRES_PASSWORD:}
    h2:
      url: jdbc:h2:file:../cookbookdb

server:
  port: 8080

ai:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:stub}
    model: claude-sonnet-5

recipes:
  dir: ../recipes

logging:
  level:
    com.cookbook: DEBUG
